<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B5BF7"/>
      <stop offset="1" stop-color="#3A1FB8"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9E7FF"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD54A"/>
      <stop offset="1" stop-color="#FFB300"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <!-- chunk bracket behind the keys -->
  <rect x="58" y="168" width="396" height="180" rx="44" fill="#FFFFFF" fill-opacity="0.12"/>
  <g font-family="DejaVu Sans, Noto Sans, Helvetica, Arial, sans-serif" font-weight="700" font-size="84" text-anchor="middle">
    <!-- key 1 -->
    <rect x="74" y="196" width="112" height="128" rx="26" fill="#1C1066"/>
    <rect x="74" y="184" width="112" height="124" rx="26" fill="url(#cap)"/>
    <text x="130" y="275" fill="#2B1C9E">t</text>
    <!-- key 2 (highlighted) -->
    <rect x="200" y="196" width="112" height="128" rx="26" fill="#8A4B00"/>
    <rect x="200" y="184" width="112" height="124" rx="26" fill="url(#hot)"/>
    <text x="256" y="275" fill="#3A1FB8">h</text>
    <!-- key 3 -->
    <rect x="326" y="196" width="112" height="128" rx="26" fill="#1C1066"/>
    <rect x="326" y="184" width="112" height="124" rx="26" fill="url(#cap)"/>
    <text x="382" y="275" fill="#2B1C9E">e</text>
  </g>
  <!-- home-row bump on the middle key -->
  <rect x="236" y="294" width="40" height="7" rx="3.5" fill="#3A1FB8" fill-opacity="0.55"/>
</svg>
